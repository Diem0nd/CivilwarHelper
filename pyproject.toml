[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civilwarhelper"
version = "0.1.0"
description = "Discord 내전(LoL/Valorant) 도우미 봇"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4,<3",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyflakes>=3",
]

[project.scripts]
civilwarhelper = "civilwarhelper:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
